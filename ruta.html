<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Conductor - Ruta 7 (Unidad Educativa San Gabriel)</title>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #f0f2f5; margin: 0; padding: 20px; }
        
        .header {
            background-color: #111;
            color: #ffcc00;
            padding: 15px 20px;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
        }
        .header h1 { margin: 0; font-size: 20px; text-transform: uppercase; }
        .badge { background: #ffcc00; color: #111; padding: 4px 12px; border-radius: 12px; font-weight: bold; font-size: 14px; }

        .grid-container {
            display: grid;
            grid-template-columns: 380px 1fr;
            gap: 20px;
        }

        @media (max-width: 900px) {
            .grid-container { grid-template-columns: 1fr; }
        }

        .panel-lateral {
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            max-height: 80vh;
            display: flex;
            flex-direction: column;
        }

        .actions {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 15px;
        }

        .btn {
            padding: 12px;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            font-size: 13px;
            transition: 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-cargar { background-color: #111; color: #ffcc00; }
        .btn-cargar:hover { background-color: #333; }

        .btn-ruta { background-color: #28a745; color: white; }
        .btn-ruta:hover { background-color: #218838; }

        .lista-estudiantes {
            overflow-y: auto;
            flex-grow: 1;
            border-top: 1px solid #eee;
            padding-top: 10px;
        }

        .card-estudiante {
            background: #f8f9fa;
            border-left: 5px solid #ffcc00;
            padding: 12px;
            margin-bottom: 10px;
            border-radius: 4px;
            font-size: 13px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .card-estudiante:hover { background: #e9ecef; }
        .card-estudiante strong { color: #111; display: block; font-size: 14px; }
        .card-estudiante .sector { font-weight: bold; color: #0056b3; }

        #map {
            width: 100%;
            height: 80vh;
            border-radius: 8px;
            border: 2px solid #111;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .numbered-icon {
            background-color: #ffcc00;
            color: #111;
            border: 2px solid #111;
            border-radius: 50%;
            font-weight: bold;
            text-align: center;
            line-height: 26px;
            font-size: 13px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.4);
        }

        .resumen-ruta {
            margin-top: 10px;
            padding: 10px;
            background-color: #e8f4f8;
            border: 1px solid #b8daff;
            border-radius: 6px;
            font-size: 13px;
            display: none;
        }
    </style>
</head>
<body>

<div class="header">
    <h1>Monitoreo de Registro y Ruta - RUTA 7</h1>
    <span class="badge">SANGABRIEL</span>
</div>

<div class="grid-container">
    <!-- Panel Izquierdo: Acciones y Lista -->
    <div class="panel-lateral">
        <div class="actions">
            <button class="btn btn-cargar" onclick="cargarEstudiantes()">🔄 Cargar / Actualizar Registros</button>
            <button class="btn btn-ruta" id="btn-generar-ruta" onclick="generarRutaOptima()" disabled>🚗 Generar Ruta Óptima</button>
        </div>

        <div id="resumen-ruta" class="resumen-ruta"></div>

        <h3>Inscritos (<span id="cant-estudiantes">0</span>)</h3>
        <div class="lista-estudiantes" id="contenedor-lista">
            <p style="color: #666; font-size: 13px; text-align: center;">Haz clic en "Cargar / Actualizar Registros" para ver los alumnos registrados.</p>
        </div>
    </div>

    <!-- Panel Derecho: Mapa -->
    <div>
        <div id="map"></div>
    </div>
</div>

<!-- Leaflet y Leaflet-Routing-Machine JS -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
    // URL del Google Apps Script
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxGj3OlegIUjJZFztnaEHcZWTVAyAwglsgFl-0G73aaTxxXuIL26avi3uRyTGUFGcTXCQ/exec";

    // Ubicación de la escuela (Punto de llegada)
    const UBICACION_COLEGIO = [-0.300000, -78.520000]; // Ajusta la coordenada de la UE San Gabriel si es necesario

    let estudiantesData = [];
    let marcadoresGroup = L.layerGroup();
    let rutaLayer = null;

    // Inicializar el mapa
    const map = L.map('map').setView([-0.330000, -78.535000], 13);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19,
        attribution: '© OpenStreetMap'
    }).addTo(map);

    marcadoresGroup.addTo(map);

    // 1. OBTENER REGISTROS DESDE GOOGLE SHEETS
    function cargarEstudiantes() {
        const contenedor = document.getElementById('contenedor-lista');
        contenedor.innerHTML = "<p style='text-align:center;'>Cargando datos...</p>";

        fetch(SCRIPT_URL)
            .then(res => res.json())
            .then(data => {
                estudiantesData = data;
                document.getElementById('cant-estudiantes').innerText = estudiantesData.length;

                if (estudiantesData.length > 0) {
                    document.getElementById('btn-generar-ruta').disabled = false;
                } else {
                    document.getElementById('btn-generar-ruta').disabled = true;
                }

                renderizarListaYMapa();
            })
            .catch(err => {
                console.error("Error al cargar datos:", err);
                contenedor.innerHTML = "<p style='color:red; text-align:center;'>Error al obtener la lista de inscritos. Verifica tu Web App de Apps Script.</p>";
            });
    }

    // 2. MOSTRAR LISTA Y PINES EN EL MAPA
    function renderizarListaYMapa() {
        const contenedor = document.getElementById('contenedor-lista');
        contenedor.innerHTML = "";
        marcadoresGroup.clearLayers();
        if (rutaLayer) map.removeLayer(rutaLayer);

        const bounds = [];

        estudiantesData.forEach((est, index) => {
            // Extraer Lat y Lng desde la URL de Google Maps
            const coords = extraerCoordenadas(est.url_maps);

            if (coords) {
                est.lat = coords.lat;
                est.lng = coords.lng;
                bounds.push([coords.lat, coords.lng]);

                // Crear Marcador Personalizado
                const customIcon = L.divIcon({
                    className: 'numbered-icon',
                    html: index + 1,
                    iconSize: [28, 28],
                    iconAnchor: [14, 14]
                });

                const marker = L.marker([coords.lat, coords.lng], { icon: customIcon });
                marker.bindPopup(`
                    <strong>#${index + 1} - ${est.nombres_estudiante}</strong><br>
                    <b>Grado:</b> ${est.grado}<br>
                    <b>Sector:</b> ${est.sector}<br>
                    <b>Dirección:</b> ${est.calle_principal} y ${est.calle_secundaria}<br>
                    <b>Teléfono:</b> <a href="https://wa.me/593${est.telefono.substring(1)}" target="_blank">${est.telefono}</a>
                `);
                marcadoresGroup.addLayer(marker);

                // Crear Card para la lista lateral
                const card = document.createElement('div');
                card.className = 'card-estudiante';
                card.innerHTML = `
                    <strong>#${index + 1} ${est.nombres_estudiante}</strong>
                    <span class="sector">${est.sector}</span>
                    <div>📍 ${est.calle_principal} ${est.numero_casa}</div>
                    <div>📞 ${est.telefono} | ⏰ ${est.horario_servicio}</div>
                `;

                card.onclick = () => {
                    map.flyTo([coords.lat, coords.lng], 17);
                    marker.openPopup();
                };

                contenedor.appendChild(card);
            }
        });

        if (bounds.length > 0) {
            map.fitBounds(bounds, { padding: [30, 30] });
        }
    }

    // Extractor de latitud y longitud desde la URL guardada
    function extraerCoordenadas(url) {
        if (!url) return null;
        const regex = /q=(-?\d+\.\d+),(-?\d+\.\d+)/;
        const match = url.match(regex);
        if (match) {
            return { lat: parseFloat(match[1]), lng: parseFloat(match[2]) };
        }
        return null;
    }

    // 3. GENERAR Y TRAZAR LA RUTA ÓPTIMA VIAL CON OSRM
    function generarRutaOptima() {
        if (estudiantesData.length === 0) return;

        const btn = document.getElementById('btn-generar-ruta');
        btn.innerText = "⏳ Trazando Ruta...";
        btn.disabled = true;

        // Formatear coordenadas para OSRM: lon,lat;lon,lat;...
        const waypoints = estudiantesData
            .filter(e => e.lat && e.lng)
            .map(e => `${e.lng},${e.lat}`);

        if (waypoints.length === 0) return;

        // Petición al servicio gratuito de OSRM
        const osrmUrl = `https://router.project-osrm.org/route/v1/driving/${waypoints.join(';')}?overview=full&geometries=geojson`;

        fetch(osrmUrl)
            .then(res => res.json())
            .then(data => {
                if (data.routes && data.routes.length > 0) {
                    const route = data.routes[0];
                    const geometry = route.geometry;

                    // Eliminar ruta anterior si existe
                    if (rutaLayer) map.removeLayer(rutaLayer);

                    // Dibujar el trazado en el mapa
                    rutaLayer = L.geoJSON(geometry, {
                        style: {
                            color: '#0066ff',
                            weight: 5,
                            opacity: 0.8
                        }
                    }).addTo(map);

                    map.fitBounds(rutaLayer.getBounds(), { padding: [40, 40] });

                    // Mostrar resumen del recorrido
                    const distanciaKm = (route.distance / 1000).toFixed(2);
                    const tiempoMin = Math.round(route.duration / 60);

                    const divResumen = document.getElementById('resumen-ruta');
                    divResumen.style.display = "block";
                    divResumen.innerHTML = `
                        <strong>📍 Resumen del Recorrido:</strong><br>
                        • Paradas: ${waypoints.length} puntos<br>
                        • Distancia aprox: <b>${distanciaKm} km</b><br>
                        • Tiempo estimado: <b>${tiempoMin} minutos</b>
                    `;
                }
                btn.innerText = "🚗 Generar Ruta Óptima";
                btn.disabled = false;
            })
            .catch(err => {
                console.error("Error al calcular ruta:", err);
                alert("No se pudo obtener el trazado vial de la ruta.");
                btn.innerText = "🚗 Generar Ruta Óptima";
                btn.disabled = false;
            });
    }
</script>

</body>
</html>
