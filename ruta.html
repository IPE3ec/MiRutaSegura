<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Conductor - Ruta 7 (Unidad Educativa San Gabriel)</title>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #f0f2f5; margin: 0; padding: 20px; }
        
        .header {
            background-color: #111;
            color: #ffcc00;
            padding: 15px 20px;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
        }
        .header h1 { margin: 0; font-size: 20px; text-transform: uppercase; }
        .badge { background: #ffcc00; color: #111; padding: 4px 12px; border-radius: 12px; font-weight: bold; font-size: 14px; }

        .grid-container {
            display: grid;
            grid-template-columns: 380px 1fr;
            gap: 20px;
        }

        @media (max-width: 900px) {
            .grid-container { grid-template-columns: 1fr; }
        }

        .panel-lateral {
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            max-height: 80vh;
            display: flex;
            flex-direction: column;
        }

        .actions {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 15px;
        }

        .btn {
            padding: 12px;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            font-size: 13px;
            transition: 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-cargar { background-color: #111; color: #ffcc00; }
        .btn-cargar:hover { background-color: #333; }

        .btn-ruta { background-color: #28a745; color: white; }
        .btn-ruta:hover { background-color: #218838; }

        .lista-estudiantes {
            overflow-y: auto;
            flex-grow: 1;
            border-top: 1px solid #eee;
            padding-top: 10px;
        }

        .card-estudiante {
            background: #f8f9fa;
            border-left: 5px solid #ffcc00;
            padding: 12px;
            margin-bottom: 10px;
            border-radius: 4px;
            font-size: 13px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .card-estudiante:hover { background: #e9ecef; }
        .card-estudiante strong { color: #111; display: block; font-size: 14px; }
        .card-estudiante .sector { font-weight: bold; color: #0056b3; }

        #map {
            width: 100%;
            height: 80vh;
            border-radius: 8px;
            border: 2px solid #111;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .numbered-icon {
            background-color: #ffcc00;
            color: #111;
            border: 2px solid #111;
            border-radius: 50%;
            font-weight: bold;
            text-align: center;
            line-height: 26px;
            font-size: 13px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.4);
        }

        .resumen-ruta {
            margin-top: 10px;
            padding: 10px;
            background-color: #e8f4f8;
            border: 1px solid #b8daff;
            border-radius: 6px;
            font-size: 13px;
            display: none;
        }
    </style>
</head>
<body>

<div class="header">
    <h1>Monitoreo de Registro y Ruta - RUTA 7</h1>
    <span class="badge">SAN GABRIEL</span>
</div>

<div class="grid-container">
    <!-- Panel Izquierdo: Acciones y Lista -->
    <div class="panel-lateral">
        <div class="actions">
            <button class="btn btn-cargar" onclick="cargarEstudiantes()">🔄 Cargar / Actualizar Registros</button>
            <button class="btn btn-ruta" id="btn-generar-ruta" onclick="generarRutaOptima()" disabled>🚗 Generar Ruta Óptima</button>
        </div>

        <div id="resumen-ruta" class="resumen-ruta"></div>

        <h3>Inscritos (<span id="cant-estudiantes">0</span>)</h3>
        <div class="lista-estudiantes" id="contenedor-lista">
            <p style="color: #666; font-size: 13px; text-align: center;">Haz clic en "Cargar / Actualizar Registros" para ver los alumnos registrados.</p>
        </div>
    </div>

    <!-- Panel Derecho: Mapa -->
    <div>
        <div id="map"></div>
    </div>
</div>

<!-- Leaflet JS -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
    // Tu URL de Google Apps Script
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxGj3OlegIUjJZFztnaEHcZWTVAyAwglsgFl-0G73aaTxxXuIL26avi3uRyTGUFGcTXCQ/exec";

    let estudiantesData = [];
    let marcadoresGroup = L.layerGroup();
    let rutaLayer = null;

    // Inicializar el mapa centrado en Quito/Sur
    const map = L.map('map').setView([-0.25, -78.52], 12);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19,
        attribution: '© OpenStreetMap'
    }).addTo(map);

    marcadoresGroup.addTo(map);

    // 1. OBTENER REGISTROS (Manejando redirección de Google con redirect: "follow")
    function cargarEstudiantes() {
        const contenedor = document.getElementById('contenedor-lista');
        contenedor.innerHTML = "<p style='text-align:center;'>⏳ Cargando datos desde Google Sheets...</p>";

        fetch(SCRIPT_URL, {
            method: "GET",
            redirect: "follow"
        })
        .then(res => res.json())
        .then(data => {
            console.log("Datos recibidos:", data);
            
            // Validar si 'data' contiene la propiedad que buscamos
            estudiantesData = Array.isArray(data) ? data : [];
            document.getElementById('cant-estudiantes').innerText = estudiantesData.length;

            if (estudiantesData.length > 0) {
                document.getElementById('btn-generar-ruta').disabled = false;
            } else {
                document.getElementById('btn-generar-ruta').disabled = true;
            }

            renderizarListaYMapa();
        })
        .catch(err => {
            console.error("Error al cargar datos:", err);
            contenedor.innerHTML = "<p style='color:red; text-align:center;'>❌ Error al cargar los registros. Revisa la consola (F12).</p>";
        });
    }

    // 2. MOSTRAR LISTA Y PINES EN EL MAPA
    function renderizarListaYMapa() {
        const contenedor = document.getElementById('contenedor-lista');
        contenedor.innerHTML = "";
        marcadoresGroup.clearLayers();
        if (rutaLayer) map.removeLayer(rutaLayer);

        const bounds = [];
        let contUbicados = 0;

        estudiantesData.forEach((est, index) => {
            // Se busca la propiedad que contenga las coordenadas / url de maps
            const urlMaps = est.url_maps || est.url || est.ubicacion || "";
            const coords = extraerCoordenadas(urlMaps);

            // Obtener el nombre o usar un valor genérico si está vacío
            const nombre = est.nombres_estudiante || est.nombre || `Estudiante #${index + 1}`;
            const sector = est.sector || 'Sin sector';
            const callePrin = est.calle_principal || '';
            const calleSec = est.calle_secundaria || '';
            const numCasa = est.numero_casa || '';
            const telefono = est.telefono || 'Sin teléfono';
            const horario = est.horario_servicio || '';

            if (coords) {
                contUbicados++;
                est.lat = coords.lat;
                est.lng = coords.lng;
                bounds.push([coords.lat, coords.lng]);

                // Crear Marcador Personalizado con Número
                const customIcon = L.divIcon({
                    className: 'numbered-icon',
                    html: contUbicados,
                    iconSize: [28, 28],
                    iconAnchor: [14, 14]
                });

                const marker = L.marker([coords.lat, coords.lng], { icon: customIcon });
                marker.bindPopup(`
                    <strong>#${contUbicados} - ${nombre}</strong><br>
                    <b>Sector:</b> ${sector}<br>
                    <b>Dirección:</b> ${callePrin} ${calleSec}<br>
                    <b>Teléfono:</b> <a href="https://wa.me/593${telefono.toString().replace(/^0/, '')}" target="_blank">${telefono}</a>
                `);
                marcadoresGroup.addLayer(marker);

                // Crear Card en la lista lateral
                const card = document.createElement('div');
                card.className = 'card-estudiante';
                card.innerHTML = `
                    <strong>#${contUbicados} ${nombre}</strong>
                    <span class="sector">${sector}</span>
                    <div>📍 ${callePrin} ${numCasa}</div>
                    <div>📞 ${telefono} ${horario ? '| ⏰ ' + horario : ''}</div>
                `;

                card.onclick = () => {
                    map.flyTo([coords.lat, coords.lng], 16);
                    marker.openPopup();
                };

                contenedor.appendChild(card);
            } else {
                // Si no tiene ubicación válida en el mapa
                const card = document.createElement('div');
                card.className = 'card-estudiante';
                card.style.borderLeftColor = '#dc3545';
                card.innerHTML = `
                    <strong>⚠️ ${nombre}</strong>
                    <span style="color:#dc3545;">Sin ubicación en el mapa</span>
                    <div>📞 ${telefono}</div>
                `;
                contenedor.appendChild(card);
            }
        });

        // Ajustar la vista del mapa para encuadrar todos los puntos
        if (bounds.length > 0) {
            map.fitBounds(bounds, { padding: [40, 40] });
        }
    }

    // Extractor mejorado de coordenadas (acepta enlaces cortos, largos y texto "lat,lng")
    function extraerCoordenadas(texto) {
        if (!texto) return null;
        
        // Buscar cualquier par numérico de coordenadas tipo -0.123456,-78.123456
        const regex = /(-?\d+\.\d+),\s*(-?\d+\.\d+)/;
        const match = texto.toString().match(regex);
        
        if (match) {
            return { 
                lat: parseFloat(match[1]), 
                lng: parseFloat(match[2]) 
            };
        }
        return null;
    }

    // 3. GENERAR Y TRAZAR RUTA ÓPTIMA CON OSRM
    function generarRutaOptima() {
        const puntosValidos = estudiantesData.filter(e => e.lat && e.lng);
        if (puntosValidos.length === 0) return;

        const btn = document.getElementById('btn-generar-ruta');
        btn.innerText = "⏳ Trazando Ruta...";
        btn.disabled = true;

        // Formatear coordenadas para OSRM: lon,lat;lon,lat;...
        const waypoints = puntosValidos.map(e => `${e.lng},${e.lat}`);

        const osrmUrl = `https://router.project-osrm.org/route/v1/driving/${waypoints.join(';')}?overview=full&geometries=geojson`;

        fetch(osrmUrl)
            .then(res => res.json())
            .then(data => {
                if (data.routes && data.routes.length > 0) {
                    const route = data.routes[0];

                    if (rutaLayer) map.removeLayer(rutaLayer);

                    // Dibujar la línea de la ruta
                    rutaLayer = L.geoJSON(route.geometry, {
                        style: {
                            color: '#0066ff',
                            weight: 5,
                            opacity: 0.8
                        }
                    }).addTo(map);

                    map.fitBounds(rutaLayer.getBounds(), { padding: [40, 40] });

                    // Mostrar métricas del recorrido
                    const distanciaKm = (route.distance / 1000).toFixed(2);
                    const tiempoMin = Math.round(route.duration / 60);

                    const divResumen = document.getElementById('resumen-ruta');
                    divResumen.style.display = "block";
                    divResumen.innerHTML = `
                        <strong>📍 Resumen del Recorrido:</strong><br>
                        • Paradas: ${puntosValidos.length} puntos<br>
                        • Distancia aprox: <b>${distanciaKm} km</b><br>
                        • Tiempo estimado: <b>${tiempoMin} minutos</b>
                    `;
                }
                btn.innerText = "🚗 Generar Ruta Óptima";
                btn.disabled = false;
            })
            .catch(err => {
                console.error("Error al calcular ruta:", err);
                alert("No se pudo trazar el recorrido vial.");
                btn.innerText = "🚗 Generar Ruta Óptima";
                btn.disabled = false;
            });
    }
</script>

</body>
</html>
