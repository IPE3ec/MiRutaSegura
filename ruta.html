<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monitoreo y Ruta Vial - San Gabriel</title>
    
    <!-- Silenciar advertencia de favicon -->
    <link rel="icon" href="data:,">

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { margin: 0; padding: 0; background-color: #f0f2f5; }
        
        #map-container {
            position: relative;
            width: 100vw;
            height: 100vh;
        }

        #map {
            width: 100%;
            height: 100%;
        }

        /* Panel flotante de control */
        .panel-control {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 1000;
            background: rgba(255, 255, 255, 0.95);
            padding: 18px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.25);
            width: 320px;
            max-height: 90vh;
            display: flex;
            flex-direction: column;
        }

        .header-panel {
            background-color: #111;
            color: #ffcc00;
            padding: 10px;
            border-radius: 6px;
            text-align: center;
            font-weight: bold;
            font-size: 14px;
            margin-bottom: 12px;
            text-transform: uppercase;
        }

        .btn {
            width: 100%;
            padding: 11px;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            font-size: 13px;
            cursor: pointer;
            text-transform: uppercase;
            transition: 0.2s;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .btn-cargar { background-color: #111; color: #ffcc00; }
        .btn-cargar:hover { background-color: #333; }

        .btn-trazar { background-color: #28a745; color: white; }
        .btn-trazar:hover { background-color: #218838; }
        .btn-trazar:disabled { background-color: #ccc; cursor: not-allowed; }

        .resumen {
            background-color: #e8f4f8;
            border: 1px solid #b8daff;
            padding: 10px;
            border-radius: 6px;
            font-size: 12px;
            margin-bottom: 10px;
            display: none;
            line-height: 1.4;
        }

        .lista-alumnos {
            overflow-y: auto;
            flex-grow: 1;
            border-top: 1px solid #eee;
            padding-top: 8px;
            margin-top: 5px;
        }

        .card-alumno {
            background: #f8f9fa;
            border-left: 4px solid #ffcc00;
            padding: 8px 10px;
            margin-bottom: 8px;
            border-radius: 4px;
            font-size: 12px;
            cursor: pointer;
        }

        .card-alumno:hover { background: #e9ecef; }
        .card-alumno strong { display: block; color: #111; }
        .card-sin-coords { border-left-color: #dc3545; color: #666; }

        /* Estilo de marcadores numerados */
        .numbered-icon {
            background-color: #ffcc00;
            color: #111;
            border: 2px solid #111;
            border-radius: 50%;
            font-weight: bold;
            text-align: center;
            line-height: 26px;
            font-size: 12px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.4);
        }
    </style>
</head>
<body>

<div id="map-container">
    <div class="panel-control">
        <div class="header-panel">RUTA 7 - SAN GABRIEL</div>
        
        <button class="btn btn-cargar" onclick="cargarDatosDesdeGoogle()">🔄 Cargar Estudiantes</button>
        <button class="btn btn-trazar" id="btn-trazar" onclick="generarRutaOptima()" disabled>🚗 Trazar Ruta Óptima</button>

        <div id="resumen" class="resumen"></div>

        <div style="font-size: 13px; font-weight: bold; margin-bottom: 5px;">
            Inscritos: <span id="cant-alumnos">0</span>
        </div>

        <div class="lista-alumnos" id="lista-alumnos">
            <p style="text-align: center; color: #777; font-size: 12px;">Haz clic en "Cargar Estudiantes" para obtener los puntos desde Google Sheets.</p>
        </div>
    </div>

    <div id="map"></div>
</div>

<!-- Leaflet JS -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
    // Enlace Web App de Google Apps Script
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxw6VjmBzYEGrykyyOX0enC6rzSCwIdX1WiOCU3qGHKFPgzLZY0Ama_Eyoq-R75RZMK/exec";

    let estudiantesData = [];
    let marcadoresGroup = L.layerGroup();
    let rutaLayer = null;

    // Inicializar mapa centrado en Quito
    const map = L.map('map').setView([-0.25, -78.52], 12);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19,
        attribution: '© OpenStreetMap'
    }).addTo(map);

    marcadoresGroup.addTo(map);

    // 1. OBTENER DATOS DESDE GOOGLE SHEETS (SIN ENCABEZADOS DE CORS MANUALES)
    function cargarDatosDesdeGoogle() {
        const contenedor = document.getElementById('lista-alumnos');
        contenedor.innerHTML = "<p style='text-align:center;'>⏳ Leyendo Google Sheets...</p>";

        fetch(SCRIPT_URL, {
            method: "GET",
            redirect: "follow"
        })
        .then(res => {
            if (!res.ok) {
                throw new Error("Respuesta de red no válida");
            }
            return res.json();
        })
        .then(data => {
            console.log("Datos recibidos correctamente:", data);
            estudiantesData = Array.isArray(data) ? data : [];
            document.getElementById('cant-alumnos').innerText = estudiantesData.length;

            if (estudiantesData.length > 0) {
                document.getElementById('btn-trazar').disabled = false;
            } else {
                document.getElementById('btn-trazar').disabled = true;
            }

            renderizarMapaYLista();
        })
        .catch(err => {
            console.error("Error al obtener los datos:", err);
            contenedor.innerHTML = "<p style='color:red; text-align:center;'>❌ Error al leer datos. Si persiste, actualiza la implementación en Apps Script a 'Nueva versión'.</p>";
        });
    }

    // 2. MOSTRAR MARCADORES Y TARJETAS
    function renderizarMapaYLista() {
        const contenedor = document.getElementById('lista-alumnos');
        contenedor.innerHTML = "";
        marcadoresGroup.clearLayers();
        if (rutaLayer) map.removeLayer(rutaLayer);

        const bounds = [];
        let contadorPuntos = 0;

        estudiantesData.forEach((est, idx) => {
            // Mapeo flexible para leer diferentes encabezados de columna
            const nombre = est.estudiante || est.nombresestudiante || est.nombre || `Estudiante #${idx + 1}`;
            const urlMaps = est.enlacegooglemaps || est.urlmaps || est.ubicacion || est.url || "";
            const telefono = est.telefono || 'Sin número';
            const sector = est.sector || 'Sin sector';

            const coords = extraerCoordenadas(urlMaps);

            if (coords) {
                contadorPuntos++;
                est.lat = coords.lat;
                est.lng = coords.lng;
                bounds.push([coords.lat, coords.lng]);

                // Ícono numerado
                const icon = L.divIcon({
                    className: 'numbered-icon',
                    html: contadorPuntos,
                    iconSize: [26, 26],
                    iconAnchor: [13, 13]
                });

                const marker = L.marker([coords.lat, coords.lng], { icon: icon });
                marker.bindPopup(`
                    <strong>#${contadorPuntos} ${nombre}</strong><br>
                    <b>Sector:</b> ${sector}<br>
                    <b>Teléfono:</b> <a href="https://wa.me/593${telefono.toString().replace(/^0/, '')}" target="_blank">${telefono}</a>
                `);
                marcadoresGroup.addLayer(marker);

                // Tarjeta en lista lateral
                const card = document.createElement('div');
                card.className = 'card-alumno';
                card.innerHTML = `
                    <strong>#${contadorPuntos} ${nombre}</strong>
                    <div>📍 ${sector}</div>
                    <div>📞 ${telefono}</div>
                `;
                card.onclick = () => {
                    map.flyTo([coords.lat, coords.lng], 16);
                    marker.openPopup();
                };
                contenedor.appendChild(card);

            } else {
                // Registro sin coordenadas
                const card = document.createElement('div');
                card.className = 'card-alumno card-sin-coords';
                card.innerHTML = `
                    <strong>⚠️ ${nombre}</strong>
                    <div>Sin ubicación válida</div>
                `;
                contenedor.appendChild(card);
            }
        });

        if (bounds.length > 0) {
            map.fitBounds(bounds, { padding: [40, 40] });
        }
    }

    // Extraer latitud y longitud desde cualquier URL o texto
    function extraerCoordenadas(texto) {
        if (!texto) return null;
        const regex = /(-?\d+\.\d+),\s*(-?\d+\.\d+)/;
        const match = texto.toString().match(regex);
        if (match) {
            return { lat: parseFloat(match[1]), lng: parseFloat(match[2]) };
        }
        return null;
    }

    // 3. TRAZADO VIAL CON MOTOR OSRM
    function generarRutaOptima() {
        const puntosValidos = estudiantesData.filter(e => e.lat && e.lng);
        if (puntosValidos.length < 2) {
            alert("Se necesitan al menos 2 puntos con ubicación para trazar la ruta.");
            return;
        }

        const btn = document.getElementById('btn-trazar');
        btn.innerText = "⏳ Calculando...";
        btn.disabled = true;

        const waypoints = puntosValidos.map(e => `${e.lng},${e.lat}`).join(';');
        const osrmUrl = `https://router.project-osrm.org/route/v1/driving/${waypoints}?overview=full&geometries=geojson`;

        fetch(osrmUrl)
            .then(res => res.json())
            .then(data => {
                if (data.routes && data.routes.length > 0) {
                    const route = data.routes[0];

                    if (rutaLayer) map.removeLayer(rutaLayer);

                    // Trazo vial
                    rutaLayer = L.geoJSON(route.geometry, {
                        style: {
                            color: '#0066ff',
                            weight: 5,
                            opacity: 0.85
                        }
                    }).addTo(map);

                    map.fitBounds(rutaLayer.getBounds(), { padding: [40, 40] });

                    // Resumen
                    const km = (route.distance / 1000).toFixed(2);
                    const min = Math.round(route.duration / 60);

                    const divResumen = document.getElementById('resumen');
                    divResumen.style.display = 'block';
                    divResumen.innerHTML = `
                        <b>📍 Resumen de Ruta:</b><br>
                        • Paradas: <b>${puntosValidos.length}</b><br>
                        • Distancia: <b>${km} km</b><br>
                        • Tiempo estim.: <b>${min} min</b>
                    `;
                }
                btn.innerText = "🚗 Trazar Ruta Óptima";
                btn.disabled = false;
            })
            .catch(err => {
                console.error("Error trazando la ruta:", err);
                alert("Ocurrió un error al calcular la ruta vial.");
                btn.innerText = "🚗 Trazar Ruta Óptima";
                btn.disabled = false;
            });
    }
</script>

</body>
</html>
