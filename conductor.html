<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Conductor - Mi Ruta Segura</title>
  <link rel="manifest" href="manifest-conductor.webmanifest">
  <meta name="theme-color" content="#111111">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <style>
    * { box-sizing: border-box; font-family: "Segoe UI", Tahoma, sans-serif; }
    body { margin: 0; background: #f2f3f5; color: #111; }
    #app { position: relative; width: 100vw; height: 100vh; overflow: hidden; }
    #map { width: 100%; height: 100%; }
    .stats { position: absolute; top: 10px; left: 10px; right: 10px; z-index: 900; display: grid; grid-template-columns: repeat(4,1fr); gap: 7px; }
    .stat { background: rgba(17,17,17,.92); color: #fff; border-radius: 8px; padding: 8px; font-size: 11px; }
    .stat b { display: block; color: #ffcc00; font-size: 15px; margin-top: 2px; }
    .panel { position: absolute; left: 10px; right: 10px; bottom: 10px; z-index: 1000; max-height: 75vh; background: rgba(255,255,255,.98); border-radius: 10px; box-shadow: 0 4px 20px rgba(0,0,0,.28); overflow: hidden; display: flex; flex-direction: column; }
    .panel.min { max-height: 174px; }
    .panel.min .body, .panel.min .tabs { display: none; }
    .head { background: #111; color: #ffcc00; padding: 12px; font-weight: 900; display: flex; justify-content: space-between; gap: 10px; align-items: center; }
    .head small { display: block; color: #fff; font-weight: 600; margin-top: 2px; }
    .head button { width: auto; margin: 0; background: #ffcc00; color: #111; }
    .tabs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1px; background: #d7d7d7; }
    .tab { border: 0; background: #eee; padding: 10px 4px; font-size: 11px; font-weight: 900; cursor: pointer; }
    .tab.active { background: #ffcc00; color: #111; }
    .body { overflow-y: auto; padding: 10px; }
    .view { display: none; }
    .view.active { display: block; }
    .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    label { display: grid; gap: 4px; font-size: 12px; font-weight: 800; }
    select, input { width: 100%; border: 1px solid #cfcfcf; border-radius: 6px; background: #fff; padding: 10px; font-size: 13px; }
    button { width: 100%; border: 0; border-radius: 6px; padding: 11px; font-size: 12px; font-weight: 900; cursor: pointer; text-transform: uppercase; margin-bottom: 8px; }
    button:disabled { background: #ccc !important; color: #777 !important; cursor: not-allowed; }
    .primary { background: #111; color: #ffcc00; }
    .success { background: #28a745; color: #fff; }
    .danger { background: #dc3545; color: #fff; }
    .soft { background: #e9ecef; color: #111; border: 1px solid #bbb; }
    .warn { background: #ffcc00; color: #111; }
    .notice { display: none; padding: 9px; border-radius: 6px; font-size: 12px; margin-bottom: 8px; }
    .notice.info { display: block; background: #fff3cd; color: #856404; border: 1px solid #ffeeba; }
    .notice.ok { display: block; background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
    .notice.error { display: block; background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
    .card { background: #f8f9fa; border-left: 4px solid #ffcc00; border-radius: 6px; padding: 9px; margin-bottom: 8px; font-size: 12px; line-height: 1.45; }
    .card.current { border-left-color: #28a745; outline: 2px solid rgba(40,167,69,.35); }
    .card.omitida { opacity: .55; border-left-color: #dc3545; }
    .card strong { display: block; font-size: 13px; margin-bottom: 4px; }
    .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-top: 7px; }
    .numbered-icon { background: #ffcc00; color: #111; border: 2px solid #111; border-radius: 50%; font-weight: 900; text-align: center; line-height: 26px; font-size: 12px; box-shadow: 0 2px 5px rgba(0,0,0,.4); }
    .gps-icon { background: #28a745; color: #fff; border: 2px solid #fff; border-radius: 50%; text-align: center; line-height: 26px; font-weight: 900; }
    .fixed-icon { border-radius: 50%; font-weight: 900; text-align: center; line-height: 30px; font-size: 15px; box-shadow: 0 2px 5px rgba(0,0,0,.4); }
    .school-icon { background: #111; color: #ffcc00; border: 2px solid #ffcc00; }
    .home-icon { background: #0066ff; color: #fff; border: 2px solid #fff; }
    @media (min-width: 780px) { .panel { left: 14px; right: auto; width: 430px; } }
    @media (max-width: 520px) { .stats { grid-template-columns: repeat(2,1fr); } .panel { max-height: 70vh; } }
  </style>
</head>
<body>
  <div id="app">
    <div class="stats">
      <div class="stat">Modo<b id="statModo">-</b></div>
      <div class="stat">Paradas<b id="statParadas">0</b></div>
      <div class="stat">Siguiente<b id="statActual">-</b></div>
      <div class="stat">ETA<b id="statEta">-</b></div>
    </div>
    <div id="map"></div>
    <section class="panel" id="panel">
      <div class="head">
        <div>Conductor Ruta 7<small id="subtitulo">Detectando horario...</small></div>
        <button onclick="togglePanel()">Panel</button>
      </div>
      <div class="tabs">
        <button class="tab active" onclick="tab('ruta')">Ruta</button>
        <button class="tab" onclick="tab('lista')">Lista/PDF</button>
        <button class="tab" onclick="tab('avisos')">Avisos</button>
        <button class="tab" onclick="tab('ajustes')">Ajustes</button>
      </div>
      <div class="body">
        <div id="msg" class="notice"></div>
        <div id="view-ruta" class="view active">
          <button class="primary" onclick="cargarDatos()">Cargar estudiantes</button>
          <button class="success" onclick="calcularRuta()" id="btnCalcular" disabled>Calcular ruta</button>
          <button class="warn" onclick="iniciarRecorrido()" id="btnIniciar" disabled>Iniciar recorrido</button>
          <button class="primary" onclick="navegarActual()" id="btnNav" disabled>Navegar al destino actual</button>
          <div class="grid2">
            <button class="success" onclick="confirmarLlegada()" id="btnLlegada" disabled>Confirmar llegada</button>
            <button class="danger" onclick="omitirActual()" id="btnOmitir" disabled>Omitir parada</button>
          </div>
          <div id="resumen"></div>
        </div>
        <div id="view-lista" class="view">
          <div class="grid2">
            <label>Buscar<input id="filtroTexto" oninput="renderLista()" placeholder="Nombre, sector, telefono"></label>
            <label>Servicio<select id="filtroServicio" onchange="renderLista()"><option value="">Todos</option><option>COMPLETO</option><option>INGRESO</option><option>SALIDA</option></select></label>
          </div>
          <button class="primary" onclick="generarPdf()">Generar PDF del listado filtrado</button>
          <div id="lista"></div>
        </div>
        <div id="view-avisos" class="view">
          <button class="primary" onclick="leerEventosPadres()">Actualizar avisos</button>
          <div id="avisos"></div>
        </div>
        <div id="view-ajustes" class="view">
          <div class="grid2">
            <label>Recorrido<select id="modo" onchange="seleccionarModo(this.value)"></select></label>
            <label>Calculo<select id="calculo"><option value="logica">Logica/ahorro</option><option value="rapida">Mas rapida</option></select></label>
          </div>
          <label>Hora objetivo<input id="horaObjetivo" type="time"></label>
          <button class="soft" onclick="detectarModoHorario()">Detectar horario actual</button>
          <button class="soft" onclick="centrarMapa()">Centrar mapa</button>
        </div>
      </div>
    </section>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzpwqzD-vpZP_IAyEfgqhTpZFKJKuCbcG5-9JflBkVaSkEIdOlqJ4xHrmCOczSFxlR_sQ/exec";
    const CASA_CONDUCTOR = { nombre: "Casa conductor", lat: -0.256837, lng: -78.558433 };
    const ESCUELA = { nombre: "Unidad Educativa San Gabriel", lat: -0.268130, lng: -78.543977 };
    const MODOS = {
      mananaEntrada: { label: "Manana entrada", horario: "MATUTINO", servicio: "INGRESO", sentido: "entrada", inicio: CASA_CONDUCTOR, fin: ESCUELA, hora: "06:50", color: "#0066ff" },
      mananaSalida: { label: "Manana salida", horario: "MATUTINO", servicio: "SALIDA", sentido: "salida", inicio: ESCUELA, fin: null, hora: "12:30", color: "#28a745" },
      tardeEntrada: { label: "Tarde entrada", horario: "VESPERTINO", servicio: "INGRESO", sentido: "entrada", inicio: CASA_CONDUCTOR, fin: ESCUELA, hora: "12:45", color: "#8e44ad" },
      tardeSalida: { label: "Tarde salida", horario: "VESPERTINO", servicio: "SALIDA", sentido: "salida", inicio: ESCUELA, fin: null, hora: "16:30", color: "#f39c12" }
    };
    let modoActual = "mananaEntrada";
    let runId = "";
    let registros = [];
    let paradas = [];
    let orden = [];
    let omitidas = new Set();
    let indiceActual = 0;
    let recorridoActivo = false;
    let ubicacionGps = null;
    let watchId = null;
    let routeLayer = null;
    let gpsMarker = null;
    let markers = L.layerGroup();
    let eventosVistos = new Set();

    const map = L.map("map").setView([ESCUELA.lat, ESCUELA.lng], 13);
    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", { maxZoom: 19, attribution: "OpenStreetMap" }).addTo(map);
    markers.addTo(map);
    init();

    function init() {
      const sel = document.getElementById("modo");
      Object.keys(MODOS).forEach(k => sel.add(new Option(MODOS[k].label, k)));
      detectarModoHorario();
      colocarFijos();
      registrarSW();
      setInterval(() => { if (recorridoActivo) enviarUbicacion(); }, 12000);
      setInterval(leerEventosPadres, 10000);
    }

    function detectarModoHorario() {
      const now = new Date();
      const m = now.getHours() * 60 + now.getMinutes();
      let modo = "mananaEntrada";
      if (m >= 240 && m < 420) modo = "mananaEntrada";
      else if (m >= 630 && m < 720) modo = "tardeEntrada";
      else if (m >= 720 && m < 840) modo = "mananaSalida";
      else if (m >= 900 && m < 1080) modo = "tardeSalida";
      seleccionarModo(modo);
    }

    function seleccionarModo(modo) {
      modoActual = modo;
      document.getElementById("modo").value = modo;
      document.getElementById("horaObjetivo").value = MODOS[modo].hora;
      document.getElementById("statModo").textContent = MODOS[modo].label;
      document.getElementById("subtitulo").textContent = MODOS[modo].label;
      if (registros.length) filtrarParadas();
    }

    function colocarFijos() {
      const home = L.divIcon({ className: "fixed-icon home-icon", html: "C", iconSize: [32,32], iconAnchor: [16,16] });
      const school = L.divIcon({ className: "fixed-icon school-icon", html: "E", iconSize: [32,32], iconAnchor: [16,16] });
      L.marker([CASA_CONDUCTOR.lat, CASA_CONDUCTOR.lng], { icon: home }).bindPopup("Casa conductor").addTo(map);
      L.marker([ESCUELA.lat, ESCUELA.lng], { icon: school }).bindPopup("Escuela").addTo(map);
    }

    function cargarDatos() {
      aviso("Leyendo Google Sheets...", "info");
      jsonp(SCRIPT_URL + "?action=records").then(data => {
        registros = (Array.isArray(data) ? data : data.records || []).map(normalizarRegistro);
        filtrarParadas();
        aviso("Datos cargados: " + registros.length + " registros.", "ok");
      }).catch(() => aviso("No se pudo leer Google Sheets.", "error"));
    }

    function filtrarParadas() {
      const cfg = MODOS[modoActual];
      paradas = registros.filter(r => coincideHorario(r.horario, cfg.horario) && coincideServicio(r.servicio, cfg.servicio))
        .map(r => ({ ...r, coords: extraerCoordenadas(r.urlMaps) }))
        .filter(r => r.coords)
        .map(r => ({ ...r, lat: r.coords.lat, lng: r.coords.lng }));
      orden = [];
      document.getElementById("btnCalcular").disabled = paradas.length === 0;
      document.getElementById("statParadas").textContent = paradas.length;
      renderLista();
      pintarMarcadores(paradas);
    }

    async function calcularRuta() {
      if (!paradas.length) return;
      const cfg = MODOS[modoActual];
      try {
        orden = document.getElementById("calculo").value === "rapida" ? await ordenarRapida(cfg) : ordenarLogica(cfg, paradas);
      } catch (e) {
        orden = ordenarLogica(cfg, paradas);
      }
      await trazarRuta(cfg);
      indiceActual = 0;
      renderLista();
      document.getElementById("btnIniciar").disabled = false;
      document.getElementById("btnNav").disabled = false;
      document.getElementById("resumen").innerHTML = "<div class='card'><strong>Ruta lista</strong>Paradas: " + orden.length + "</div>";
      togglePanel(true);
    }

    function iniciarRecorrido() {
      if (!orden.length) return;
      recorridoActivo = true;
      runId = modoActual + "-" + Date.now();
      indiceActual = siguientePendiente(0);
      document.getElementById("btnLlegada").disabled = false;
      document.getElementById("btnOmitir").disabled = false;
      enviarEvento("inicio_recorrido", { runId, mensaje: "Recorrido iniciado" });
      iniciarGps();
      actualizarActual();
      navegarActual();
      leerEventosPadres();
    }

    function iniciarGps() {
      if (!navigator.geolocation) return aviso("Este celular no tiene GPS disponible.", "error");
      if (watchId) navigator.geolocation.clearWatch(watchId);
      watchId = navigator.geolocation.watchPosition(pos => {
        ubicacionGps = { lat: pos.coords.latitude, lng: pos.coords.longitude, accuracy: pos.coords.accuracy };
        pintarGps();
        enviarUbicacion();
        revisarLlegadaAutomatica();
      }, () => aviso("Activa permiso de ubicacion GPS.", "error"), { enableHighAccuracy: true, maximumAge: 3000, timeout: 15000 });
    }

    function revisarLlegadaAutomatica() {
      const actual = orden[indiceActual];
      if (!recorridoActivo || !actual || !ubicacionGps) return;
      const metros = distanciaKm(ubicacionGps.lat, ubicacionGps.lng, actual.lat, actual.lng) * 1000;
      document.getElementById("statEta").textContent = Math.max(1, Math.round(metros / 260)) + " min";
      if (metros <= 70) confirmarLlegada();
    }

    function confirmarLlegada() {
      const actual = orden[indiceActual];
      if (!actual) return finalizarRecorrido();
      enviarEvento("llegada_parada", { runId, estudiante: actual.estudiante, telefono: actual.telefono, parada: String(indiceActual + 1), lat: actual.lat, lng: actual.lng, mensaje: "Conductor llego a la parada" });
      indiceActual = siguientePendiente(indiceActual + 1);
      actualizarActual();
      if (orden[indiceActual]) navegarActual(); else finalizarRecorrido();
    }

    function omitirActual() {
      const actual = orden[indiceActual];
      if (!actual) return;
      omitidas.add(actual.telefono || actual.estudiante);
      enviarEvento("omitir_parada", { runId, estudiante: actual.estudiante, telefono: actual.telefono, parada: String(indiceActual + 1), mensaje: "Parada omitida por conductor" });
      indiceActual = siguientePendiente(indiceActual + 1);
      actualizarActual();
      renderLista();
      if (orden[indiceActual]) navegarActual(); else finalizarRecorrido();
    }

    function siguientePendiente(i) {
      while (i < orden.length && omitidas.has(orden[i].telefono || orden[i].estudiante)) i++;
      return i;
    }

    function finalizarRecorrido() {
      recorridoActivo = false;
      enviarEvento("fin_recorrido", { runId, mensaje: "Recorrido finalizado" });
      aviso("Recorrido finalizado.", "ok");
      document.getElementById("btnLlegada").disabled = true;
      document.getElementById("btnOmitir").disabled = true;
      document.getElementById("statActual").textContent = "Fin";
    }

    function actualizarActual() {
      const actual = orden[indiceActual];
      document.getElementById("statActual").textContent = actual ? "#" + (indiceActual + 1) : "Fin";
      pintarMarcadores(orden.length ? orden : paradas);
    }

    function navegarActual() {
      const actual = orden[indiceActual] || orden[0];
      if (!actual) return;
      window.open("https://www.google.com/maps/dir/?api=1&destination=" + actual.lat + "," + actual.lng + "&travelmode=driving", "_blank");
    }

    function leerEventosPadres() {
      jsonp(SCRIPT_URL + "?action=events").then(data => {
        const eventos = (data.events || []).filter(e => String(e.tipo || "").startsWith("padre_"));
        const box = document.getElementById("avisos");
        if (!eventos.length) box.innerHTML = "<div class='card'>Sin avisos de padres.</div>";
        eventos.slice(-20).reverse().forEach(e => {
          const key = [e.fechaservidor, e.tipo, e.telefono, e.estudiante].join("|");
          if (!eventosVistos.has(key)) {
            eventosVistos.add(key);
            avisoSonoro("Aviso de padre: " + (e.tipo || "aviso") + " | Alumno: " + (e.estudiante || "Sin nombre") + " | Sector: " + (e.sector || "Sin sector") + " | Tel: " + (e.telefono || "Sin telefono"));
          }
        });
        box.innerHTML = eventos.slice(-20).reverse().map(e => "<div class='card'><strong>" + esc(e.tipo) + "</strong>" + esc(e.estudiante || "") + "<br>" + esc(e.mensaje || "") + "<br><small>" + esc(e.fechaservidor || "") + "</small></div>").join("");
        aplicarOmisionesPadres(eventos);
      }).catch(() => {});
    }

    function aplicarOmisionesPadres(eventos) {
      eventos.forEach(e => {
        if (e.tipo === "padre_no_asiste" || e.tipo === "padre_retiro_escuela") {
          const tel = normalizarTelefono(e.telefono);
          orden.forEach(p => { if (normalizarTelefono(p.telefono) === tel) omitidas.add(p.telefono || p.estudiante); });
        }
      });
      renderLista();
    }

    function renderLista() {
      const texto = normalizar(document.getElementById("filtroTexto")?.value || "");
      const serv = normalizar(document.getElementById("filtroServicio")?.value || "");
      const base = orden.length ? orden : paradas;
      const filtrada = base.filter(p => (!texto || normalizar([p.estudiante,p.sector,p.telefono].join(" ")).includes(texto)) && (!serv || normalizar(p.servicio).includes(serv)));
      document.getElementById("lista").innerHTML = filtrada.map((p, i) => cardAlumno(p, base.indexOf(p) + 1)).join("") || "<div class='card'>Sin alumnos.</div>";
    }

    function cardAlumno(p, n) {
      const omitida = omitidas.has(p.telefono || p.estudiante);
      const tel = telefonoInternacional(p.telefono);
      return "<div class='card " + (omitida ? "omitida" : "") + "'><strong>#" + n + " " + esc(p.estudiante) + "</strong>Sector: " + esc(p.sector) + "<br>Telefono: " + esc(p.telefono) + "<br>Servicio: " + esc(p.servicio) + "<div class='actions'><button class='soft' onclick=\"window.open('tel:" + tel + "')\">Llamar</button><button class='soft' onclick=\"window.open('https://wa.me/" + tel + "')\">WhatsApp</button></div></div>";
    }

    function generarPdf() {
      const base = orden.length ? orden : paradas;
      const html = "<!doctype html><html><head><title>Listado Ruta 7</title><style>body{font-family:Arial;padding:20px}table{width:100%;border-collapse:collapse}td,th{border:1px solid #999;padding:6px;font-size:12px}h2{margin:0 0 10px}</style></head><body><h2>Listado Ruta 7 - " + MODOS[modoActual].label + "</h2><table><thead><tr><th>#</th><th>Estudiante</th><th>Sector</th><th>Telefono</th><th>Servicio</th><th>Estado</th></tr></thead><tbody>" + base.map((p,i)=>"<tr><td>"+(i+1)+"</td><td>"+esc(p.estudiante)+"</td><td>"+esc(p.sector)+"</td><td>"+esc(p.telefono)+"</td><td>"+esc(p.servicio)+"</td><td></td></tr>").join("") + "</tbody></table><script>window.print()<\/script></body></html>";
      const w = window.open("", "_blank");
      w.document.write(html);
      w.document.close();
    }

    async function ordenarRapida(cfg) {
      const puntos = cfg.sentido === "entrada" ? [cfg.inicio, ...paradas, cfg.fin] : [cfg.inicio, ...paradas];
      const coords = puntos.map(p => p.lng + "," + p.lat).join(";");
      const dest = cfg.sentido === "entrada" ? "last" : "any";
      const data = await fetch("https://router.project-osrm.org/trip/v1/driving/" + coords + "?source=first&destination=" + dest + "&roundtrip=false&overview=false").then(r => r.json());
      if (!data.waypoints) throw new Error("Sin ruta rapida");
      return data.waypoints.map((wp, idx) => ({ idx, order: wp.waypoint_index })).sort((a,b)=>a.order-b.order).map(x=>x.idx)
        .filter(i => i !== 0 && !(cfg.sentido === "entrada" && i === puntos.length - 1)).map(i => puntos[i]);
    }

    function ordenarLogica(cfg, puntos) {
      if (cfg.sentido === "entrada") {
        const pendientes = [...puntos].sort((a,b)=>distanciaKm(ESCUELA.lat,ESCUELA.lng,b.lat,b.lng)-distanciaKm(ESCUELA.lat,ESCUELA.lng,a.lat,a.lng));
        return ordenarDesde(pendientes.shift(), pendientes);
      }
      return ordenarDesde(cfg.inicio, [...puntos]);
    }

    function ordenarDesde(inicio, pendientes) {
      const ordenados = [];
      let actual = inicio;
      if (actual && actual.estudiante) ordenados.push(actual);
      while (pendientes.length) {
        let best = 0, d = distanciaKm(actual.lat, actual.lng, pendientes[0].lat, pendientes[0].lng);
        for (let i=1;i<pendientes.length;i++) { const nd = distanciaKm(actual.lat, actual.lng, pendientes[i].lat, pendientes[i].lng); if (nd < d) { d = nd; best = i; } }
        actual = pendientes.splice(best, 1)[0];
        ordenados.push(actual);
      }
      return ordenados;
    }

    async function trazarRuta(cfg) {
      const puntos = cfg.sentido === "entrada" ? [cfg.inicio, ...orden, cfg.fin] : [cfg.inicio, ...orden];
      const url = "https://router.project-osrm.org/route/v1/driving/" + puntos.map(p=>p.lng+","+p.lat).join(";") + "?overview=full&geometries=geojson";
      const data = await fetch(url).then(r=>r.json());
      if (!data.routes || !data.routes[0]) return;
      if (routeLayer) map.removeLayer(routeLayer);
      routeLayer = L.geoJSON(data.routes[0].geometry, { style: { color: cfg.color, weight: 6, opacity: .85 } }).addTo(map);
      map.fitBounds(routeLayer.getBounds(), { padding: [45,45] });
    }

    function pintarMarcadores(lista) {
      markers.clearLayers();
      lista.forEach((p,i)=>{
        const icon = L.divIcon({ className: "numbered-icon", html: i+1, iconSize:[28,28], iconAnchor:[14,14] });
        markers.addLayer(L.marker([p.lat,p.lng], { icon }).bindPopup("#" + (i+1) + " " + esc(p.estudiante) + "<br>Tel: " + esc(p.telefono)));
      });
    }

    function pintarGps() {
      const icon = L.divIcon({ className: "gps-icon", html: "G", iconSize:[28,28], iconAnchor:[14,14] });
      if (!gpsMarker) gpsMarker = L.marker([ubicacionGps.lat, ubicacionGps.lng], { icon }).addTo(map);
      else gpsMarker.setLatLng([ubicacionGps.lat, ubicacionGps.lng]);
    }

    function enviarUbicacion() {
      if (!ubicacionGps) return;
      enviarEvento("ubicacion", { runId, lat: ubicacionGps.lat, lng: ubicacionGps.lng, precision: ubicacionGps.accuracy, mensaje: "Ubicacion conductor" });
    }

    function enviarEvento(tipo, extra) {
      const payload = { action: "event", tipo, modo: modoActual, fecha: new Date().toISOString(), ...extra };
      fetch(SCRIPT_URL, { method: "POST", mode: "no-cors", body: new URLSearchParams(payload) }).catch(()=>{});
    }

    function jsonp(url) {
      return new Promise((resolve, reject) => {
        const cb = "cb_" + Date.now() + "_" + Math.floor(Math.random()*10000);
        const s = document.createElement("script");
        window[cb] = data => { cleanup(); resolve(data); };
        s.onerror = () => { cleanup(); reject(new Error("JSONP fallo")); };
        s.src = url + (url.includes("?") ? "&" : "?") + "callback=" + cb + "&t=" + Date.now();
        document.body.appendChild(s);
        function cleanup(){ delete window[cb]; if (s.parentNode) s.parentNode.removeChild(s); }
      });
    }

    function coincideHorario(v,h){ return normalizar(v).includes(h); }
    function coincideServicio(v,s){ const t = normalizar(v || "COMPLETO"); return !t || t.includes("COMPLETO") || (s === "INGRESO" && (t.includes("INGRESO") || t.includes("ENTRADA") || t.includes("MANANA"))) || (s === "SALIDA" && t.includes("SALIDA")); }
    function normalizarRegistro(r){ return { token: clean(r.token), estudiante: clean(r.estudiante||r.nombresestudiante), representante: clean(r.representante), telefono: clean(r.telefono), sector: clean(r.sector), horario: clean(r.tipodeservicio||r.horario||r.tiposervicio), servicio: clean(r.servicio||"COMPLETO"), estado: clean(r.estado), valor: clean(r.valor), urlMaps: clean(r.enlacegooglemaps||r.urlmaps||r.url_maps) }; }
    function extraerCoordenadas(t){ const v=clean(t).replace(/"/g," ").replace(/\n/g," "); let m=v.match(/q=(-?\d+(?:\.\d+)?),\s*(-?\d+(?:\.\d+)?)/i)||v.match(/@(-?\d+(?:\.\d+)?),\s*(-?\d+(?:\.\d+)?)/i)||v.match(/(-?\d+(?:\.\d+)?),\s*(-?\d+(?:\.\d+)?)/); return m ? {lat:+m[1], lng:+m[2]} : null; }
    function distanciaKm(a,b,c,d){ const R=6371, dLat=rad(c-a), dLng=rad(d-b); const x=Math.sin(dLat/2)**2+Math.cos(rad(a))*Math.cos(rad(c))*Math.sin(dLng/2)**2; return R*2*Math.atan2(Math.sqrt(x),Math.sqrt(1-x)); }
    function centrarMapa(){ const pts=[CASA_CONDUCTOR,ESCUELA,...(orden.length?orden:paradas)].map(p=>[p.lat,p.lng]); map.fitBounds(pts,{padding:[45,45]}); }
    function tab(id){ document.querySelectorAll(".tab").forEach(b=>b.classList.remove("active")); event.target.classList.add("active"); document.querySelectorAll(".view").forEach(v=>v.classList.remove("active")); document.getElementById("view-"+id).classList.add("active"); }
    function togglePanel(forceMin){ const p=document.getElementById("panel"); p.classList.toggle("min", typeof forceMin==="boolean" ? forceMin : !p.classList.contains("min")); setTimeout(()=>map.invalidateSize(),250); }
    function aviso(t, tipo){ const el=document.getElementById("msg"); el.textContent=t; el.className="notice "+(tipo||"info"); }
    function avisoSonoro(t){ aviso(t,"info"); try{ if(Notification.permission==="granted") new Notification(t); const c=new (AudioContext||webkitAudioContext)(), o=c.createOscillator(), g=c.createGain(); o.frequency.value=880; g.gain.value=.08; o.connect(g); g.connect(c.destination); o.start(); setTimeout(()=>{o.stop();c.close();},350); }catch(e){} }
    function registrarSW(){ if("serviceWorker" in navigator) navigator.serviceWorker.register("sw-conductor.js").catch(()=>{}); if("Notification" in window && Notification.permission==="default") Notification.requestPermission(); }
    function telefonoInternacional(t){ let n=clean(t).replace(/\D/g,""); if(n.startsWith("593")) return n; if(n.startsWith("0")) return "593"+n.slice(1); return "593"+n; }
    function normalizarTelefono(t){ let n=clean(t).replace(/\D/g,""); if(n.startsWith("593")) n=n.slice(3); if(n.startsWith("0")) n=n.slice(1); return n; }
    function normalizar(v){ return clean(v).toUpperCase().normalize("NFD").replace(/[\u0300-\u036f]/g,""); }
    function clean(v){ return String(v||"").trim(); }
    function rad(n){ return n*Math.PI/180; }
    function esc(v){ return String(v||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#039;"); }
  </script>
</body>
