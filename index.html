<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mi Ruta Segura - Registro</title>
  <style>
    :root {
      --primary: #1565d8;
      --primary-dark: #0b4fb3;
      --success: #0f8a4b;
      --danger: #c62828;
      --warning: #b7791f;
      --bg: #f3f6fb;
      --card: #ffffff;
      --ink: #182033;
      --muted: #667085;
      --line: #dbe3ef;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: var(--bg);
      color: var(--ink);
    }
    .app {
      width: min(960px, 100%);
      margin: 0 auto;
      min-height: 100vh;
      background: #fff;
    }
    .hero {
      background: var(--primary);
      color: white;
      padding: 26px 18px 30px;
    }
    .hero h1 { margin: 0; font-size: 26px; }
    .hero p { margin: 8px 0 0; line-height: 1.45; opacity: .92; }
    main { padding: 18px; }
    .card {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--card);
      padding: 16px;
      margin-bottom: 16px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
    }
    label { display: block; font-weight: 700; font-size: 13px; margin: 0 0 6px; }
    input, select, textarea {
      width: 100%;
      min-height: 44px;
      border: 1px solid #cfd8e6;
      border-radius: 8px;
      padding: 10px 12px;
      font: inherit;
      background: white;
      color: var(--ink);
    }
    textarea { min-height: 82px; resize: vertical; }
    .full { grid-column: 1 / -1; }
    .actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 14px; }
    button {
      border: 0;
      border-radius: 8px;
      min-height: 44px;
      padding: 0 16px;
      font-weight: 700;
      cursor: pointer;
      color: white;
      background: var(--primary);
    }
    button.secondary { background: #475569; }
    button:disabled { opacity: .65; cursor: wait; }
    .message {
      display: none;
      border-radius: 8px;
      padding: 12px;
      margin: 0 0 16px;
      line-height: 1.4;
      font-weight: 700;
    }
    .message.ok { display: block; color: #064e2b; background: #dff7ea; border: 1px solid #a9e6c2; }
    .message.error { display: block; color: #7f1d1d; background: #fde2e2; border: 1px solid #f3b6b6; }
    .message.info { display: block; color: #1e3a8a; background: #dbeafe; border: 1px solid #a8c7fa; }
    .small { color: var(--muted); font-size: 13px; line-height: 1.45; }
    @media (max-width: 720px) {
      .grid { grid-template-columns: 1fr; }
      main { padding: 14px; }
      .hero h1 { font-size: 23px; }
      .actions button { width: 100%; }
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="hero">
      <h1>Mi Ruta Segura</h1>
      <p>Registro para transporte escolar. Completa los datos del estudiante, representante, sector y punto de recogida.</p>
    </header>

    <main>
      <div id="mensaje" class="message info">Formulario listo para enviar.</div>

      <section class="card">
        <form id="formulario-registro" autocomplete="on">
          <div class="grid">
            <div>
              <label for="nombres_estudiante">Nombres del estudiante</label>
              <input id="nombres_estudiante" name="nombres_estudiante" required>
            </div>
            <div>
              <label for="apellidos_estudiante">Apellidos del estudiante</label>
              <input id="apellidos_estudiante" name="apellidos_estudiante" required>
            </div>
            <div>
              <label for="nivel">Nivel</label>
              <select id="nivel" name="nivel" required>
                <option value="">Seleccionar</option>
                <option>Inicial</option>
                <option>Basica elemental</option>
                <option>Basica media</option>
                <option>Basica superior</option>
                <option>Bachillerato</option>
              </select>
            </div>
            <div>
              <label for="grado">Grado / curso</label>
              <input id="grado" name="grado" required>
            </div>
            <div>
              <label for="nombre_representante">Nombre del representante</label>
              <input id="nombre_representante" name="nombre_representante" required>
            </div>
            <div>
              <label for="telefono">Telefono / WhatsApp</label>
              <input id="telefono" name="telefono" inputmode="tel" required>
            </div>
            <div>
              <label for="correo">Correo</label>
              <input id="correo" name="correo" type="email">
            </div>
            <div>
              <label for="sector">Sector</label>
              <select id="sector" name="sector" required>
                <option value="">Seleccionar</option>
                <option>Centro</option>
                <option>Norte</option>
                <option>Sur</option>
                <option>Este</option>
                <option>Oeste</option>
                <option>Valle</option>
                <option>Otro</option>
              </select>
            </div>
            <div>
              <label for="calle_principal">Calle principal</label>
              <input id="calle_principal" name="calle_principal" required>
            </div>
            <div>
              <label for="calle_secundaria">Calle secundaria</label>
              <input id="calle_secundaria" name="calle_secundaria" required>
            </div>
            <div>
              <label for="numero_casa">Numero de casa</label>
              <input id="numero_casa" name="numero_casa">
            </div>
            <div>
              <label for="horario_servicio">Horario del servicio</label>
              <select id="horario_servicio" name="horario_servicio" required>
                <option value="">Seleccionar</option>
                <option>Solo ida</option>
                <option>Solo retorno</option>
                <option>Ida y retorno</option>
              </select>
            </div>
            <div class="full">
              <label for="url_maps">Enlace de Google Maps de la parada</label>
              <input id="url_maps" name="url_maps" type="url" placeholder="https://maps.google.com/...">
            </div>
            <div class="full">
              <label for="referencia">Referencia del domicilio o parada</label>
              <textarea id="referencia" name="referencia" required></textarea>
            </div>
            <div class="full">
              <label for="observaciones">Observaciones</label>
              <textarea id="observaciones" name="observaciones" placeholder="Alergias, autorizados para recibir, indicaciones de seguridad, etc."></textarea>
            </div>
          </div>

          <input type="hidden" name="origen" value="GitHub Pages">
          <input type="hidden" name="fecha_cliente" id="fecha_cliente">

          <div class="actions">
            <button id="btnEnviar" type="submit">Enviar registro</button>
            <button class="secondary" type="button" id="btnUbicacion">Usar mi ubicacion actual</button>
          </div>
          <p class="small">Si usas el boton de ubicacion, se completara el enlace de Maps con la posicion del celular.</p>
        </form>
      </section>
    </main>
  </div>

  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzbZGPjHlZfGfny-ba-XViaBfXk_rjoK1_ONdTCdPvO4oBUCURjCnFTvLAfDDkXSQVj/exec";

    const form = document.getElementById("formulario-registro");
    const mensaje = document.getElementById("mensaje");
    const btnEnviar = document.getElementById("btnEnviar");
    const btnUbicacion = document.getElementById("btnUbicacion");
    const fechaCliente = document.getElementById("fecha_cliente");
    const urlMaps = document.getElementById("url_maps");

    function mostrarMensaje(tipo, texto) {
      mensaje.className = "message " + tipo;
      mensaje.textContent = texto;
    }

    function validarConfig() {
      return SCRIPT_URL && SCRIPT_URL.startsWith("https://script.google.com/macros/s/") && SCRIPT_URL.endsWith("/exec");
    }

    btnUbicacion.addEventListener("click", () => {
      if (!navigator.geolocation) {
        mostrarMensaje("error", "Este navegador no permite obtener ubicacion GPS.");
        return;
      }

      mostrarMensaje("info", "Obteniendo ubicacion...");
      navigator.geolocation.getCurrentPosition(
        (pos) => {
          const lat = pos.coords.latitude.toFixed(7);
          const lng = pos.coords.longitude.toFixed(7);
          urlMaps.value = `https://www.google.com/maps?q=${lat},${lng}`;
          mostrarMensaje("ok", "Ubicacion agregada al formulario.");
        },
        () => mostrarMensaje("error", "No se pudo obtener la ubicacion. Revisa permisos del navegador."),
        { enableHighAccuracy: true, timeout: 12000, maximumAge: 0 }
      );
    });

    form.addEventListener("submit", async (event) => {
      event.preventDefault();

      if (!validarConfig()) {
        mostrarMensaje("error", "Falta configurar SCRIPT_URL con la URL /exec de Google Apps Script.");
        return;
      }

      fechaCliente.value = new Date().toISOString();
      btnEnviar.disabled = true;
      btnEnviar.textContent = "Enviando...";
      mostrarMensaje("info", "Enviando registro a Google Sheets...");

      try {
        const body = new URLSearchParams(new FormData(form));
        const response = await fetch(SCRIPT_URL, {
          method: "POST",
          body
        });

        const text = await response.text();
        let data;
        try {
          data = JSON.parse(text);
        } catch (parseError) {
          throw new Error("Apps Script no devolvio JSON valido. Respuesta: " + text.slice(0, 120));
        }

        if (!response.ok || !data.ok) {
          throw new Error(data.error || "Google Sheets no confirmo el guardado.");
        }

        mostrarMensaje("ok", "Registro guardado correctamente. Codigo: " + data.id);
        form.reset();
      } catch (error) {
        console.error(error);
        mostrarMensaje("error", "No se pudo guardar el registro: " + error.message);
      } finally {
        btnEnviar.disabled = false;
        btnEnviar.textContent = "Enviar registro";
      }
    });
  </script>
</body>
</html>
