<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscripción Transporte Escolar - UE San Gabriel</title>
    <style>
        * { box-sizing: border-box; font-family: Arial, sans-serif; }
        body { background-color: #f4f6f9; margin: 0; padding: 20px; }
        .container { max-width: 650px; margin: 0 auto; background: #ffffff; padding: 25px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        h2 { color: #1b365d; text-align: center; margin-bottom: 5px; }
        p.subtitle { text-align: center; color: #555; font-size: 14px; margin-bottom: 20px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; color: #333; }
        input[type="text"], input[type="tel"], select, textarea { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; font-size: 14px; }
        .section-title { background-color: #e9ecef; padding: 8px 12px; font-weight: bold; color: #1b365d; border-left: 4px solid #1b365d; margin-top: 20px; margin-bottom: 15px; }
        #map { width: 100%; height: 280px; border-radius: 4px; border: 1px solid #ccc; margin-bottom: 10px; }
        .map-instruction { font-size: 12px; color: #666; margin-bottom: 8px; }
        button { width: 100%; background-color: #1b365d; color: white; border: none; padding: 12px; font-size: 16px; font-weight: bold; border-radius: 4px; cursor: pointer; margin-top: 15px; }
        button:hover { background-color: #12243e; }
        button:disabled { background-color: #888888; cursor: not-allowed; }
        .mensaje-exito { display: none; background-color: #d4edda; color: #155724; padding: 15px; border-radius: 4px; text-align: center; font-weight: bold; margin-top: 15px; }
    </style>
</head>
<body>

<div class="container">
    <h2>Registro de Recorrido Escolar</h2>
    <p class="subtitle">Unidad Educativa San Gabriel</p>
    
    <form id="formulario-registro">
        
        <div class="section-title">1. Datos del Estudiante</div>
        <div class="form-group">
            <label for="nombres_estudiante">Nombres y Apellidos del Estudiante:</label>
            <input type="text" id="nombres_estudiante" name="nombres_estudiante" required>
        </div>
        <div class="form-group">
            <label for="nivel">Nivel Educativo:</label>
            <select id="nivel" name="nivel" required>
                <option value="">Seleccione una opción</option>
                <option value="Inicial">Inicial</option>
                <option value="Educacion Basica">Educación General Básica</option>
            </select>
        </div>
        <div class="form-group">
            <label for="grado">Grado / Año de EGB:</label>
            <input type="text" id="grado" name="grado" placeholder="Ej. Inicial 2, 3ro EGB, etc." required>
        </div>

        <div class="section-title">2. Datos del Representante</div>
        <div class="form-group">
            <label for="nombre_representante">Nombre del Representante Legal:</label>
            <input type="text" id="nombre_representante" name="nombre_representante" required>
        </div>
        <div class="form-group">
            <label for="telefono">Teléfono / WhatsApp de Contacto:</label>
            <input type="tel" id="telefono" name="telefono" required>
        </div>

        <div class="section-title">3. Dirección y Ubicación</div>
        <div class="form-group">
            <label for="sector">Sector:</label>
            <select id="sector" name="sector" required>
                <option value="">Seleccione un sector</option>
                <option value="Ciudad Jardín">Ciudad Jardín</option>
                <option value="Venecia">Venecia</option>
                <option value="Santo Tomás 1">Santo Tomás 1</option>
                <option value="Santo Tomás 2">Santo Tomás 2</option>
                <option value="Caupicho">Caupicho</option>
                <option value="Beaterio">Beaterio</option>
                <option value="La Bretaña">La Bretaña</option>
            </select>
        </div>
        <div class="form-group">
            <label for="calle_principal">Calle Principal:</label>
            <input type="text" id="calle_principal" name="calle_principal" required>
        </div>
        <div class="form-group">
            <label for="calle_secundaria">Calle Secundaria:</label>
            <input type="text" id="calle_secundaria" name="calle_secundaria" required>
        </div>
        <div class="form-group">
            <label for="numero_casa">Número de Casa / Lote:</label>
            <input type="text" id="numero_casa" name="numero_casa" placeholder="Ej. N12-34 / Lote 5" required>
        </div>

        <div class="form-group">
            <label>Ubicación en Google Maps:</label>
            <p class="map-instruction">Haz clic o arrastra el PIN sobre la ubicación exacta de tu domicilio:</p>
            <div id="map"></div>
            <input type="hidden" id="url_maps" name="url_maps">
        </div>

        <div class="form-group">
            <label for="referencia">Referencia Adicional (Opcional):</label>
            <textarea id="referencia" name="referencia" rows="2" placeholder="Frente a la tienda, portón blanco, etc."></textarea>
        </div>

        <div class="form-group">
            <label for="tipo_servicio">Tipo de Servicio Solicitado:</label>
            <select id="tipo_servicio" name="tipo_servicio" required>
                <option value="">Seleccione el tipo de servicio</option>
                <option value="Completo">Completo (Ida y Vuelta)</option>
                <option value="Solo Ida">Solo Ida (Mañana)</option>
                <option value="Solo Vuelta">Solo Vuelta (Tarde)</option>
            </select>
        </div>

        <button type="submit" id="btn-enviar">Enviar Inscripción</button>
    </form>

    <div id="mensaje-exito" class="mensaje-exito">
        ¡Inscripción realizada con éxito! La información se ha guardado en la hoja de registro.
    </div>
</div>

<!-- API de Google Maps (Reemplazar TU_API_KEY con tu clave de Google Cloud) -->
<script src="https://www.google.com/maps?q=lat,lng](https://www.google.com/maps?q=lat,lng)" async defer></script>

<script>
    // PEGA AQUÍ LA URL QUE COPIASTE DE TU GOOGLE APPS SCRIPT
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyqwiY6axQqd03UpgTv_Z9qa_6a04oI9nJ8q4kuOJDu3yZ4odUiELroR3Kj-d12WcCU/exec";

    let map, marker;

    function initMap() {
        const ubicacionInicial = { lat: -0.3200, lng: -78.5400 }; // Coordenadas aproximadas
        map = new google.maps.Map(document.getElementById("map"), {
            zoom: 14,
            center: ubicacionInicial,
        });

        marker = new google.maps.Marker({
            position: ubicacionInicial,
            map: map,
            draggable: true,
            title: "Ubicación Domicilio"
        });

        actualizarCoordenadas(ubicacionInicial.lat, ubicacionInicial.lng);

        google.maps.event.addListener(marker, 'dragend', function(evt) {
            actualizarCoordenadas(evt.latLng.lat(), evt.latLng.lng());
        });

        map.addListener("click", (e) => {
            marker.setPosition(e.latLng);
            actualizarCoordenadas(e.latLng.lat(), e.latLng.lng());
        });
    }

    function actualizarCoordenadas(lat, lng) {
        document.getElementById('url_maps').value = `https://www.google.com/maps?q=${lat},${lng}`;
    }

    // Envío del formulario directo a Google Sheets
    document.getElementById('formulario-registro').addEventListener('submit', function(e) {
        e.preventDefault();
        
        const btn = document.getElementById('btn-enviar');
        btn.disabled = true;
        btn.innerText = "Guardando inscripción...";

        const formData = new FormData(this);

        fetch(SCRIPT_URL, {
            method: 'POST',
            body: formData
        })
        .then(response => {
            document.getElementById('formulario-registro').style.display = 'none';
            document.getElementById('mensaje-exito').style.display = 'block';
        })
        .catch(error => {
            alert('Ocurrió un error al enviar el formulario. Inténtalo de nuevo.');
            btn.disabled = false;
            btn.innerText = "Enviar Inscripción";
        });
    });
</script>

</body>
</html>
