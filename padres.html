<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Padres - Mi Ruta Segura</title>
  <link rel="manifest" href="manifest-padres.webmanifest">
  <meta name="theme-color" content="#111111">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <style>
    * { box-sizing: border-box; font-family: "Segoe UI", Tahoma, sans-serif; }
    body { margin: 0; background: #f2f3f5; color: #111; }
    #app { width: 100vw; height: 100vh; position: relative; overflow: hidden; }
    #map { width: 100%; height: 100%; }
    .stats { position: absolute; top: 10px; left: 10px; right: 10px; z-index: 900; display: grid; grid-template-columns: repeat(3,1fr); gap: 7px; }
    .stat { background: rgba(17,17,17,.92); color: #fff; border-radius: 8px; padding: 8px; font-size: 11px; }
    .stat b { display: block; color: #ffcc00; font-size: 15px; margin-top: 2px; }
    .panel { position: absolute; left: 10px; right: 10px; bottom: 10px; z-index: 1000; background: rgba(255,255,255,.98); border-radius: 10px; overflow: hidden; box-shadow: 0 4px 20px rgba(0,0,0,.25); max-height: 76vh; display: flex; flex-direction: column; }
    .panel.min { max-height: 152px; }
    .panel.min .body, .panel.min .tabs { display: none; }
    .head { background: #111; color: #ffcc00; padding: 13px; font-weight: 900; display: flex; justify-content: space-between; gap: 10px; align-items: center; }
    .head small { display: block; color: #fff; font-weight: 600; margin-top: 2px; }
    .head button { width: auto; margin: 0; background: #ffcc00; color: #111; }
    .tabs { display: grid; grid-template-columns: repeat(4,1fr); gap: 1px; background: #ddd; }
    .tab { border: 0; background: #eee; padding: 10px 4px; font-size: 11px; font-weight: 900; cursor: pointer; }
    .tab.active { background: #ffcc00; color: #111; }
    .body { padding: 10px; overflow-y: auto; }
    .view { display: none; }
    .view.active { display: block; }
    button { width: 100%; border: 0; border-radius: 6px; padding: 11px; font-weight: 900; text-transform: uppercase; margin-bottom: 8px; cursor: pointer; }
    .primary { background: #111; color: #ffcc00; }
    .success { background: #28a745; color: #fff; }
    .danger { background: #dc3545; color: #fff; }
    .soft { background: #e9ecef; color: #111; border: 1px solid #bbb; }
    .card { background: #f8f9fa; border-left: 4px solid #ffcc00; border-radius: 6px; padding: 10px; margin-bottom: 8px; font-size: 13px; line-height: 1.45; }
    .card.ok { border-left-color: #28a745; }
    .card.warn { border-left-color: #f39c12; }
    .card.danger { border-left-color: #dc3545; }
    .alerta { display: none; background: #fff3cd; border: 1px solid #ffeeba; color: #856404; border-radius: 8px; padding: 10px; margin-bottom: 8px; font-weight: 800; }
    .alerta.on { display: block; }
    .bus-icon { background: #ffcc00; color: #111; border: 2px solid #111; border-radius: 50%; text-align: center; line-height: 30px; font-weight: 900; box-shadow: 0 2px 6px rgba(0,0,0,.35); }
    .home-icon { background: #0066ff; color: #fff; border: 2px solid #fff; border-radius: 50%; text-align: center; line-height: 28px; font-weight: 900; box-shadow: 0 2px 6px rgba(0,0,0,.35); }
    .school-icon { background: #111; color: #ffcc00; border: 2px solid #ffcc00; border-radius: 50%; text-align: center; line-height: 30px; font-weight: 900; box-shadow: 0 2px 6px rgba(0,0,0,.35); }
    @media (min-width: 780px) { .panel { left: auto; right: 14px; width: 390px; } }
  </style>
</head>
<body>
  <div id="app">
    <div class="stats">
      <div class="stat">Distancia<b id="distancia">-</b></div>
      <div class="stat">ETA<b id="eta">-</b></div>
      <div class="stat">Estado<b id="estadoTop">-</b></div>
    </div>
    <div id="map"></div>
    <section class="panel" id="panel">
      <div class="head"><div>Mi Ruta Segura<small id="sub">Cargando estudiante...</small></div><button onclick="togglePanel()">Panel</button></div>
      <div class="tabs">
        <button class="tab active" onclick="tab('recorrido')">Recorrido</button>
        <button class="tab" onclick="tab('alumno')">Alumno</button>
        <button class="tab" onclick="tab('pagos')">Pagos</button>
        <button class="tab" onclick="tab('avisos')">Avisos</button>
      </div>
      <div class="body">
        <div id="alerta" class="alerta"></div>
        <div id="view-recorrido" class="view active">
          <div id="recorridoCard" class="card">Cargando datos...</div>
          <button class="primary" onclick="actualizarTodo()">Actualizar</button>
          <button class="soft" onclick="activarNotificaciones()">Activar notificaciones y sonido</button>
        </div>
        <div id="view-alumno" class="view"><div id="alumnoCard" class="card"></div></div>
        <div id="view-pagos" class="view"><div id="pagosCard" class="card"></div></div>
        <div id="view-avisos" class="view">
          <button class="danger" onclick="avisarNoAsiste()">Mi hijo no asiste hoy</button>
          <button class="soft" onclick="avisarRetiroEscuela()">Lo retiro en la escuela</button>
          <div class="card">Estos avisos se envian al conductor cuando su PWA esta abierta o actualizando eventos.</div>
        </div>
      </div>
    </section>
  </div>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyhYsofdLrIMIon20Bqi09lkeUkLHMrMHFmDXvhVQ72W4UMKXTsQq46ubDGyF2Iky7n8A/exec";
    const ESCUELA = { nombre: "Unidad Educativa San Gabriel", lat: -0.268130, lng: -78.543977 };
    const params = new URLSearchParams(location.search);
    const TOKEN = clean(params.get("token"));
    const TELEFONO = normalizarTelefono(params.get("telefono"));
    let alumno = null;
    let parada = null;
    let bus = null;
    let ultimoTipoAlerta = "";
    let busMarker = null;
    let homeMarker = null;
    let routeLayer = null;
    const map = L.map("map").setView([ESCUELA.lat, ESCUELA.lng], 13);
    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", { maxZoom: 19, attribution: "OpenStreetMap" }).addTo(map);
    init();

    function init() {
      registrarSW();
      if (!TOKEN && !TELEFONO) {
        document.getElementById("recorridoCard").innerHTML = "<b>Enlace personal incompleto.</b><br>Usa padres.html?telefono=0983092180 o padres.html?token=CODIGO";
        return;
      }
      actualizarTodo();
      setInterval(actualizarEventos, 8000);
    }

    function actualizarTodo() {
      jsonp(SCRIPT_URL + "?action=records").then(data => {
        const records = (Array.isArray(data) ? data : data.records || []).map(normalizarRegistro);
        alumno = records.find(r => (TOKEN && normalizar(r.token) === normalizar(TOKEN)) || (TELEFONO && normalizarTelefono(r.telefono) === TELEFONO));
        if (!alumno) {
          document.getElementById("recorridoCard").innerHTML = "<b>No se encontro estudiante.</b><br>Revisa el telefono/token del enlace.";
          return;
        }
        parada = extraerCoordenadas(alumno.urlMaps);
        renderAlumno();
        pintarParada();
        actualizarEventos();
      });
    }

    function actualizarEventos() {
      if (!alumno) return;
      jsonp(SCRIPT_URL + "?action=events").then(data => {
        const eventos = data.events || [];
        const ubicaciones = eventos.filter(e => e.tipo === "ubicacion" && e.lat && e.lng);
        if (!ubicaciones.length) {
          document.getElementById("recorridoCard").innerHTML = "<b>Todavia no hay ubicacion enviada por el conductor.</b><br>Cuando el conductor inicie recorrido y active GPS, aparecera aqui.";
          document.getElementById("estadoTop").textContent = "Sin GPS";
          return;
        }
        const u = ubicaciones[ubicaciones.length - 1];
        bus = { lat: Number(u.lat), lng: Number(u.lng), fecha: u.fechaservidor || u.fechacliente || "", modo: u.modo || "" };
        pintarBus();
        renderRecorrido();
      }).catch(() => {});
    }

    function renderRecorrido() {
      if (!alumno || !parada || !bus) return;
      const metros = distanciaKm(bus.lat, bus.lng, parada.lat, parada.lng) * 1000;
      const eta = Math.max(1, Math.round(metros / 260));
      document.getElementById("distancia").textContent = metros >= 1000 ? (metros/1000).toFixed(1) + " km" : Math.round(metros) + " m";
      document.getElementById("eta").textContent = eta + " min";
      document.getElementById("estadoTop").textContent = metros <= 70 ? "Llego" : (metros <= 500 ? "Cerca" : "En ruta");
      document.getElementById("recorridoCard").innerHTML = "<b>" + esc(alumno.estudiante) + "</b><br>Transporte en recorrido.<br>Ultima ubicacion: " + esc(bus.fecha) + "<br>Distancia a tu parada: <b>" + document.getElementById("distancia").textContent + "</b><br>ETA aproximada: <b>" + eta + " min</b>";
      if (metros <= 70) alerta("La furgoneta ya llego a la parada.", "llego");
      else if (metros <= 500) alerta("La furgoneta esta cerca. Prepara al estudiante.", "cerca");
      dibujarLinea();
    }

    function renderAlumno() {
      document.getElementById("sub").textContent = alumno.estudiante;
      document.getElementById("alumnoCard").innerHTML = "<b>" + esc(alumno.estudiante) + "</b><br>Representante: " + esc(alumno.representante) + "<br>Sector: " + esc(alumno.sector) + "<br>Grado: " + esc(alumno.grado) + "<br>Servicio: " + esc(alumno.servicio);
      document.getElementById("pagosCard").innerHTML = "<b>Pagos</b><br>Valor: $" + esc(alumno.valor || "0") + "<br>Estado: <b>" + esc(alumno.estado || "PENDIENTE") + "</b><br>Servicio contratado: " + esc(alumno.servicio || "COMPLETO");
    }

    function pintarParada() {
      if (!parada) return;
      const icon = L.divIcon({ className: "home-icon", html: "P", iconSize:[30,30], iconAnchor:[15,15] });
      if (!homeMarker) homeMarker = L.marker([parada.lat, parada.lng], { icon }).addTo(map);
      else homeMarker.setLatLng([parada.lat, parada.lng]);
      homeMarker.bindPopup("Parada de " + esc(alumno.estudiante));
      map.setView([parada.lat, parada.lng], 15);
    }

    function pintarBus() {
      const icon = L.divIcon({ className: "bus-icon", html: "B", iconSize:[32,32], iconAnchor:[16,16] });
      if (!busMarker) busMarker = L.marker([bus.lat, bus.lng], { icon }).addTo(map);
      else busMarker.setLatLng([bus.lat, bus.lng]);
      if (parada) map.fitBounds([[bus.lat,bus.lng],[parada.lat,parada.lng]], { padding: [55,55] });
    }

    function dibujarLinea() {
      if (routeLayer) map.removeLayer(routeLayer);
      routeLayer = L.polyline([[bus.lat,bus.lng],[parada.lat,parada.lng]], { color: "#0066ff", weight: 4, dashArray: "8 8" }).addTo(map);
    }

    function avisarNoAsiste() {
      if (!alumno) return;
      enviarEvento("padre_no_asiste", "El estudiante no asistira hoy.");
      alerta("Aviso enviado al conductor: no asiste hoy.", "padre_no_asiste");
    }

    function avisarRetiroEscuela() {
      if (!alumno) return;
      enviarEvento("padre_retiro_escuela", "El padre retirara al estudiante en la escuela.");
      alerta("Aviso enviado al conductor: retiro en escuela.", "padre_retiro_escuela");
    }

    function enviarEvento(tipo, mensaje) {
      const payload = { action: "event", tipo, estudiante: alumno.estudiante, telefono: alumno.telefono, mensaje, fecha: new Date().toISOString() };
      fetch(SCRIPT_URL, { method: "POST", mode: "no-cors", body: new URLSearchParams(payload) }).catch(()=>{});
    }

    function alerta(texto, tipo) {
      const el = document.getElementById("alerta");
      el.textContent = texto;
      el.className = "alerta on";
      if (ultimoTipoAlerta !== tipo) {
        ultimoTipoAlerta = tipo;
        notificar(texto);
      }
    }

    function notificar(texto) {
      try {
        if (Notification.permission === "granted") navigator.serviceWorker.ready.then(reg => reg.showNotification("Mi Ruta Segura", { body: texto, tag: "mi-ruta-segura" }));
        reproducirSonido();
      } catch (e) {}
    }

    function activarNotificaciones() {
      if ("Notification" in window) Notification.requestPermission();
      reproducirSonido();
    }

    function reproducirSonido() {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.frequency.value = 880;
        gain.gain.value = .08;
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        setTimeout(()=>{ osc.stop(); ctx.close(); }, 450);
      } catch(e) {}
    }

    function normalizarRegistro(r){ return { token: clean(r.token), estudiante: clean(r.estudiante||r.nombresestudiante), representante: clean(r.representante), telefono: clean(r.telefono), sector: clean(r.sector), grado: clean(r.gradoano||r.grado), horario: clean(r.tipodeservicio||r.horario||r.tiposervicio), servicio: clean(r.servicio||"COMPLETO"), estado: clean(r.estado), valor: clean(r.valor), urlMaps: clean(r.enlacegooglemaps||r.urlmaps||r.url_maps) }; }
    function extraerCoordenadas(t){ const v=clean(t).replace(/"/g," ").replace(/\n/g," "); let m=v.match(/q=(-?\d+(?:\.\d+)?),\s*(-?\d+(?:\.\d+)?)/i)||v.match(/@(-?\d+(?:\.\d+)?),\s*(-?\d+(?:\.\d+)?)/i)||v.match(/(-?\d+(?:\.\d+)?),\s*(-?\d+(?:\.\d+)?)/); return m ? {lat:+m[1], lng:+m[2]} : null; }
    function jsonp(url){ return new Promise((resolve,reject)=>{ const cb="cb_"+Date.now()+"_"+Math.floor(Math.random()*10000); const s=document.createElement("script"); window[cb]=d=>{cleanup();resolve(d)}; s.onerror=()=>{cleanup();reject(new Error("jsonp"))}; s.src=url+(url.includes("?")?"&":"?")+"callback="+cb+"&t="+Date.now(); document.body.appendChild(s); function cleanup(){delete window[cb]; if(s.parentNode)s.parentNode.removeChild(s);} }); }
    function distanciaKm(a,b,c,d){ const R=6371, dLat=rad(c-a), dLng=rad(d-b); const x=Math.sin(dLat/2)**2+Math.cos(rad(a))*Math.cos(rad(c))*Math.sin(dLng/2)**2; return R*2*Math.atan2(Math.sqrt(x),Math.sqrt(1-x)); }
    function registrarSW(){ if("serviceWorker" in navigator) navigator.serviceWorker.register("sw-padres.js").catch(()=>{}); }
    function tab(id){ document.querySelectorAll(".tab").forEach(b=>b.classList.remove("active")); event.target.classList.add("active"); document.querySelectorAll(".view").forEach(v=>v.classList.remove("active")); document.getElementById("view-"+id).classList.add("active"); }
    function togglePanel(){ const p=document.getElementById("panel"); p.classList.toggle("min"); setTimeout(()=>map.invalidateSize(),250); }
    function normalizarTelefono(v){ let n=clean(v).replace(/\D/g,""); if(n.startsWith("593"))n=n.slice(3); if(n.startsWith("0"))n=n.slice(1); return n; }
    function normalizar(v){ return clean(v).toUpperCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^A-Z0-9]/g,""); }
    function clean(v){ return String(v||"").trim(); }
    function rad(n){ return n*Math.PI/180; }
    function esc(v){ return String(v||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#039;"); }
  </script>
</body>
</html>
